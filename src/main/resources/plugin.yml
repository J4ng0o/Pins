name: Pins
version: 1.0.0
main: com.example.emojiprefix.EmojiPrefixPlugin
api-version: '1.21'
authors: [YourName]
description: Allows players to set emoji prefixes before their name
commands:
  pins:
    description: Manage emoji prefixes
    usage: /pins [set|give]
    aliases: [p, emoji]
permissions:
  emojiprefix.admin:
    description: Allows using /pins give
    default: op
